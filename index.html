<!DOCTYPE html>
<html lang="en" data-theme="home">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" data-i18n-content="meta.home.desc" content="Alerego photographs cosplay and companies. Studio, conventions, offices, and events.">
    <meta name="theme-color" content="#1a0b10">
    <title data-i18n="meta.home.title">Alerego · Photographer</title>
    <link rel="canonical" href="https://alerego.dev/">
    <link rel="icon" href="/favicon.png" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Alerego">
    <meta property="og:title" data-i18n-content="meta.home.title" content="Alerego · Photographer">
    <meta property="og:description" data-i18n-content="meta.home.og" content="Photographer and videographer. Cosplay and corporate work.">
    <meta property="og:url" content="https://alerego.dev/">
    <meta property="og:image" content="https://alerego.dev/images/og/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" data-i18n-content="meta.home.title" content="Alerego · Photographer">
    <meta name="twitter:description" data-i18n-content="meta.home.og" content="Photographer and videographer. Cosplay and corporate work.">
    <meta name="twitter:image" content="https://alerego.dev/images/og/og-image.jpg">
    <link rel="stylesheet" href="/styles/site.css?v=20260902l">
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("alerego-lang");
        var lang = stored === "it" || stored === "en" ? stored : ((navigator.language || "").toLowerCase().indexOf("it") === 0 ? "it" : "en");
        document.documentElement.lang = lang;
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="/styles/gallery.css?v=20260902l">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Alerego",
      "url": "https://alerego.dev/",
      "jobTitle": "Photographer",
      "email": "contact@alerego.dev",
      "image": "https://alerego.dev/images/og/og-image.jpg"
    }
    </script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
    <header class="site-nav">
        <div class="site-nav__inner">
            <a class="wordmark" href="/">Alerego</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Menu" data-nav-toggle data-i18n-attr="aria-label:nav.menu"><span class="nav-toggle__bars" aria-hidden="true"></span></button>
            <nav id="site-nav-links" class="site-nav__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <a class="nav-link nav-link--cosplay" href="/cosplay/">Cosplay</a>
                <a class="nav-link nav-link--corporate" href="/corporate/">Corporate</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
                    <button type="button" data-set-lang="en">EN</button>
                    <button type="button" data-set-lang="it">IT</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="main">
        <section class="intro-hero" id="intro-hero" aria-labelledby="hero-title">
            <div class="intro-hero__inner">
                <div class="intro-copy">
                    <p class="intro-role" data-i18n="home.role">Photographer and videographer</p>
                    <h1 id="hero-title" data-i18n="home.title">I shoot cosplay and companies</h1>
                    <p class="intro-lead" data-i18n="home.lead">Same camera. Different lights. Armor one week, a keynote the next.</p>
                    <div class="intro-actions">
                        <a class="btn btn--sm btn--primary" href="/about/" data-i18n="home.aboutBtn">About me</a>
                    </div>
                </div>
                <div class="intro-field" aria-hidden="true">
                    <div class="field-grain"></div>
                </div>
            </div>
        </section>

        <section class="worlds" id="worlds" aria-label="Portfolios" data-i18n-attr="aria-label:home.worlds">
            <a class="world world--cosplay" href="/cosplay/">
                <span class="world__photos" data-world-photos="cosplay"></span>
                <span class="world__shade"></span>
                <span class="world__copy">
                    <span class="world__name">Cosplay</span>
                    <span class="world__hint" data-i18n="home.hint.cosplay">Characters, conventions, studio</span>
                </span>
            </a>
            <a class="world world--corporate" href="/corporate/">
                <span class="world__photos" data-world-photos="corporate"></span>
                <span class="world__shade"></span>
                <span class="world__copy">
                    <span class="world__name">Corporate</span>
                    <span class="world__hint" data-i18n="home.hint.corporate">Offices, stages, teams</span>
                </span>
            </a>
        </section>

        <section class="section home-grid" aria-labelledby="recent-title">
            <div class="section__head">
                <div>
                    <h2 id="recent-title" data-i18n="home.recent">Recent frames</h2>
                </div>
            </div>
            <div id="home-gallery" data-gallery-grid></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>&copy; <span data-year></span> Alerego</p>
            <div class="site-footer__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <a class="site-footer__admin" href="/admin/" rel="nofollow">Admin</a>
            </div>
        </div>
    </footer>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" data-i18n-attr="aria-label:lightbox.photo">
        <button type="button" class="lightbox__btn lightbox__close" data-i18n-attr="aria-label:lightbox.close" data-lightbox-close>&times;</button>
        <button type="button" class="lightbox__btn lightbox__prev" data-i18n-attr="aria-label:lightbox.prev" data-lightbox-prev>&lsaquo;</button>
        <button type="button" class="lightbox__btn lightbox__next" data-i18n-attr="aria-label:lightbox.next" data-lightbox-next>&rsaquo;</button>
        <img id="lightbox-img" width="1600" height="1200" alt="Photo" data-i18n-attr="alt:lightbox.photo">
        <p id="caption" hidden></p>
    </div>

    <script src="/scripts/i18n.js?v=20260902i" defer></script>
    <script src="/scripts/site.js?v=20260902i" defer></script>
    <script src="/scripts/ordered-grid-layout.js" defer></script>
    <script src="/scripts/gallery.js?v=20260902i" defer></script>
    <script src="/scripts/home-config.js?v=20260902i" defer></script>
    <script src="/scripts/landing-stage.js?v=20260902i" defer></script>
</body>
</html>
