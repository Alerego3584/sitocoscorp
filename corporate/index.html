<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" data-i18n-content="meta.corporate.desc" content="Corporate photography by Alerego. Product launches, leadership portraits, and event narratives for brands and teams.">
    <meta name="theme-color" content="#0e1715">
    <title data-i18n="meta.corporate.title">Alerego · Corporate</title>
    <link rel="canonical" href="https://alerego.dev/corporate/">
    <link rel="icon" href="/favicon.png" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:title" data-i18n-content="meta.corporate.title" content="Alerego · Corporate">
    <meta property="og:description" data-i18n-content="meta.corporate.og" content="Corporate photography by Alerego. Brands held in a cinematic frame.">
    <meta property="og:url" content="https://alerego.dev/corporate/">
    <meta property="og:image" content="https://alerego.dev/images/og/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alerego.dev/images/og/og-image.jpg">
    <link rel="stylesheet" href="/styles/site.css?v=20260902l">
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("alerego-lang");
        var lang = stored === "it" || stored === "en" ? stored : ((navigator.language || "").toLowerCase().indexOf("it") === 0 ? "it" : "en");
        document.documentElement.lang = lang;
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="/styles/gallery.css?v=20260902l">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ImageGallery",
      "name": "Alerego Corporate Portfolio",
      "url": "https://alerego.dev/corporate/",
      "creator": { "@type": "Person", "name": "Alerego" }
    }
    </script>
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
    <header class="site-nav">
        <div class="site-nav__inner">
            <a class="wordmark" href="/">Alerego</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Menu" data-nav-toggle data-i18n-attr="aria-label:nav.menu"><span class="nav-toggle__bars" aria-hidden="true"></span></button>
            <nav id="site-nav-links" class="site-nav__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <a class="nav-link nav-link--cosplay" href="/cosplay/">Cosplay</a>
                <a class="nav-link nav-link--corporate" href="/corporate/" aria-current="page">Corporate</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
                    <button type="button" data-set-lang="en">EN</button>
                    <button type="button" data-set-lang="it">IT</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="main">
        <section class="page-head">
            <h1>Corporate</h1>
            <p data-i18n="corporate.lead">Launches, portraits, events. Click a frame for the set.</p>
        </section>

        <section class="section section--after-head">
            <div class="section__head">
                <div>
                    <h2 data-i18n="section.photos">Photos</h2>
                </div>
            </div>
            <div id="gallery" data-gallery-grid data-empty-prompt="corporate-config.js"></div>
        </section>

        <section class="section">
            <div class="section__head">
                <div>
                    <span class="accent-rule" aria-hidden="true"></span>
                    <h2 data-i18n="section.sets">Sets</h2>
                </div>
            </div>
            <div class="gallery-masonry" id="corporate-featured-events"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>&copy; <span data-year></span> Alerego</p>
            <div class="site-footer__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <a class="site-footer__admin" href="/admin/" rel="nofollow">Admin</a>
            </div>
        </div>
    </footer>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" data-i18n-attr="aria-label:lightbox.corporate">
        <button type="button" class="lightbox__btn lightbox__close" data-i18n-attr="aria-label:lightbox.close" data-lightbox-close>&times;</button>
        <button type="button" class="lightbox__btn lightbox__prev" data-i18n-attr="aria-label:lightbox.prev" data-lightbox-prev>&lsaquo;</button>
        <button type="button" class="lightbox__btn lightbox__next" data-i18n-attr="aria-label:lightbox.next" data-lightbox-next>&rsaquo;</button>
        <img id="lightbox-img" width="1600" height="1200" alt="Corporate full view" data-i18n-attr="alt:lightbox.corporate">
        <p id="caption" hidden></p>
    </div>

    <script src="/scripts/i18n.js?v=20260902i" defer></script>
    <script src="/scripts/site.js?v=20260902i" defer></script>
    <script src="/scripts/ordered-grid-layout.js" defer></script>
    <script src="/scripts/gallery.js?v=20260902i" defer></script>
    <script src="/scripts/corporate-config.js?v=20260902i" defer></script>
</body>
</html>
