name = "alerego"
compatibility_date = "2024-09-23"
pages_build_output_dir = "."

# Bindings live on the existing Pages project (dashboard). Names must stay
# ALEREGO_META and ALEREGO_GALLERY. Do not create new KV/R2.
# Git push to master is enough; Pages already has the bindings and env vars.
#
# wrangler ids below are placeholders for CLI-only deploys.

[[kv_namespaces]]
binding = "ALEREGO_META"
id = "REPLACE_WITH_EXISTING_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "ALEREGO_GALLERY"
bucket_name = "alerego-gallery"
