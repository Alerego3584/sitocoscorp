<!DOCTYPE html>
<html lang="en" data-theme="cosplay">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" data-i18n-content="meta.set.desc" content="A photography set from the Alerego archive.">
    <meta name="theme-color" content="#140c18">
    <title id="gallery-title">Gallery Set · Alerego</title>
    <link rel="canonical" href="https://alerego.dev/set-gallery">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Gallery Set · Alerego">
    <meta property="og:description" data-i18n-content="meta.set.desc" content="A photography set from the Alerego archive.">
    <meta property="og:url" content="https://alerego.dev/set-gallery">
    <meta property="og:image" content="https://alerego.dev/images/og/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://alerego.dev/images/og/og-image.jpg">
    <link rel="stylesheet" href="/styles/site.css?v=20260902l">
    <script>
    (function () {
      try {
        var stored = localStorage.getItem("alerego-lang");
        var lang = stored === "it" || stored === "en" ? stored : ((navigator.language || "").toLowerCase().indexOf("it") === 0 ? "it" : "en");
        document.documentElement.lang = lang;
      } catch (e) {}
    })();
    </script>
    <link rel="stylesheet" href="/styles/gallery.css?v=20260902l">
</head>
<body>
    <a class="skip-link" href="#main" data-i18n="nav.skip">Skip to content</a>
    <div id="gallery-bg" hidden></div>
    <header class="site-nav">
        <div class="site-nav__inner">
            <a class="wordmark" id="back-button" href="/">Alerego</a>
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links" aria-label="Menu" data-nav-toggle data-i18n-attr="aria-label:nav.menu"><span class="nav-toggle__bars" aria-hidden="true"></span></button>
            <nav id="site-nav-links" class="site-nav__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <a class="nav-link nav-link--cosplay" href="/cosplay/">Cosplay</a>
                <a class="nav-link nav-link--corporate" href="/corporate/">Corporate</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <div class="lang-switch" role="group" data-i18n-attr="aria-label:nav.language">
                    <button type="button" data-set-lang="en">EN</button>
                    <button type="button" data-set-lang="it">IT</button>
                </div>
            </nav>
        </div>
    </header>

    <main id="main">
        <section class="section" style="padding-bottom: 0;">
            <p id="gallery-category" class="pager__meta" data-i18n="set.category">Gallery set</p>
            <h1 id="gallery-main-title" style="margin-top: 0.75rem; font-size: clamp(2.5rem, 6vw, 4.25rem); font-weight: 400; letter-spacing: -0.04em; line-height: 1.05;" data-i18n="set.loadingTitle">Loading gallery</h1>
            <p id="gallery-description" style="margin-top: 1rem; max-width: 48ch; color: var(--mute);" data-i18n="set.loadingDesc">Loading description</p>
        </section>

        <section class="section">
            <div id="image-grid"></div>
            <div id="pagination" class="pager">
                <button type="button" id="prev-page" class="btn btn--ghost" data-i18n="set.prev">Previous</button>
                <div class="pager__meta">
                    <span id="page-info">Page 1 of 1</span>
                    <span id="image-count">0 images</span>
                </div>
                <button type="button" id="next-page" class="btn btn--ghost" data-i18n="set.next">Next</button>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="site-footer__inner">
            <p>&copy; <span data-year></span> Alerego</p>
            <div class="site-footer__links">
                <a href="/about/" data-i18n="nav.about">About</a>
                <button type="button" data-contact-open aria-haspopup="dialog" aria-expanded="false" aria-controls="contact-dialog" data-i18n="nav.contact">Contact</button>
                <a class="site-footer__admin" href="/admin/" rel="nofollow">Admin</a>
            </div>
        </div>
    </footer>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" data-i18n-attr="aria-label:lightbox.gallery">
        <button type="button" class="lightbox__btn lightbox__close" data-i18n-attr="aria-label:lightbox.close" data-lightbox-close>&times;</button>
        <button type="button" class="lightbox__btn lightbox__prev" data-i18n-attr="aria-label:lightbox.prev" data-lightbox-prev>&lsaquo;</button>
        <button type="button" class="lightbox__btn lightbox__next" data-i18n-attr="aria-label:lightbox.next" data-lightbox-next>&rsaquo;</button>
        <img id="lightbox-img" width="1600" height="1200" alt="Gallery image" data-i18n-attr="alt:lightbox.gallery">
        <p id="caption" hidden></p>
    </div>

    <script src="/scripts/i18n.js?v=20260902i" defer></script>
    <script src="/scripts/site.js?v=20260902i" defer></script>
    <script src="/scripts/ordered-grid-layout.js" defer></script>
    <script src="/scripts/set-gallery-viewer.js?v=20260902l" defer></script>
</body>
</html>
